[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontol-edu"
version = "0.1.0"
description = "Тренажёр по дискретной математике на онтологии ONTOL"
readme = "CLAUDE.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3",
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
raster = ["cairosvg>=2.7", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "uml_dsl" = "ontol_core/uml_dsl" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ontol*"]

[tool.setuptools.package-data]
uml_dsl = ["styles/*.css"]

[tool.pytest.ini_options]
pythonpath = [".", "ontol_core"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
norecursedirs = ["ontol_core", ".git", "__pycache__"]
